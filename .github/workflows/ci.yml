# CI: lint dan test setiap ada perubahan (keputusan 40).
# Hanya membaca kode, tanpa rahasia atau token.
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Run lama di branch yang sama dibatalkan jika ada push baru
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - name: Ambil kode
        uses: actions/checkout@v7

      - name: Siapkan Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Pasang library
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Lint
        run: python -m ruff check src tests streamlit_app.py

      - name: Test
        run: python -X utf8 -m pytest
